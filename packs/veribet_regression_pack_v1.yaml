        opponent_quality: upper-mid home team
    expected:
      should_analyze: true
      expected_data_grade: A-
      expected_risk_level: high
      expected_confidence_cap: medium
      expected_structures:
        - 联赛客热防平盘
      expected_main_direction:
        - 客胜
      expected_secondary_direction:
        - 平局
      expected_tail_direction:
        - null
      required_flags:
        - 联赛客热降权
        - 客热脆弱度高
      forbidden_terms:
        - 投注建议
        - 稳
        - 必出
        - 仓位
      notes:
        - Draw must be retained
        - Must not describe as lock

