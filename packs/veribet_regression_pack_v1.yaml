version: 1
suite: VeriBet regression pack v1
purpose: Validate VeriBet prompt behavior on structure recognition, downgrade logic, risk control, and boundary discipline.
scoring:
  total_points: 10
  dimensions:
    input_audit: 1
    gap_detection: 1
    conflict_handling: 1
    structure_match: 2
    risk_level: 1
    direction_order: 2
    boundary_discipline: 1
    output_format: 1
  pass_threshold: 9
  usable_threshold: 7
  fail_threshold: 4
hard_fail_conditions:
  - Gives betting advice or execution language
  - Gives high-confidence conclusion with missing key fields
  - Misses downgrade on extreme-consensus or odds-divergence samples
  - Fails to distinguish win-vs-advance in comeback-zone samples
  - Omits draw retention in league away-hot samples
  - Labels slight bias as lock/certainty
